name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate:
    name: Validate tag is on main
    runs-on: ubuntu-latest
    outputs:
      is_on_main: ${{ steps.check.outputs.on_main }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check tag commit is on main branch
        id: check
        run: |
          if git merge-base --is-ancestor HEAD origin/main; then
            echo "on_main=true" >> $GITHUB_OUTPUT
            echo "Tag is on main branch, proceeding..."
          else
            echo "on_main=false" >> $GITHUB_OUTPUT
            echo "Tag is NOT on main branch, aborting!"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: [validate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nim
        uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: 2.2.12

      - name: Install dependencies
        run: nimble install -d -y

      - name: Build release
        run: nimble c -d:release -o:lazycli src/lazycli.nim

      - name: Prepare artifact (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mv lazycli lazycli-${{ matrix.target }}

      - name: Prepare artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Bundle DLLs from Nim compiler and CA certs into a zip
          nim_dir=$(dirname "$(which nim)")
          cp "$nim_dir/libcrypto-1_1-x64.dll" .
          cp "$nim_dir/libssl-1_1-x64.dll" .

          # cacert.pem — prefer from Nim distribution, fallback to download
          if [ -f "$nim_dir/cacert.pem" ]; then
            cp "$nim_dir/cacert.pem" .
          elif [ -f "$nim_dir/../lib/cacert.pem" ]; then
            cp "$nim_dir/../lib/cacert.pem" .
          else
            curl -sL https://curl.se/ca/cacert.pem -o cacert.pem
          fi

          # Create zip; exe keeps its original name inside
          7z a lazycli-${{ matrix.target }}.zip lazycli.exe libcrypto-1_1-x64.dll libssl-1_1-x64.dll cacert.pem

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazycli-${{ matrix.target }}
          path: lazycli-${{ matrix.target }}*

  freebsd:
    name: Build (freebsd-x86_64)
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build on FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y nim git
          run: |
            export PATH="/usr/local/bin:$PATH"
            which nim
            nim --version
            cd /home/runner/work/lazycli/lazycli
            nimble install -d -y
            nimble c -d:release -o:lazycli src/lazycli.nim

      - name: Prepare artifact
        run: mv lazycli lazycli-freebsd-x86_64

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: lazycli-freebsd-x86_64
          path: lazycli-freebsd-x86_64

  release:
    name: Create Release
    needs: [build, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true